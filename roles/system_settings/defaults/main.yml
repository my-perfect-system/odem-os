---
system_settings_hostname: "{{ inventory_hostname }}"

# Custom /etc/hosts entries — list of dicts mapping an IP to one or more
# hostnames plus an optional FQDN. Each entry becomes a single /etc/hosts line:
# "<ip>\t<names...> [fqdn]".
#
# Example:
# system_settings_hosts_entries:
#   - ip: 10.23.43.10
#     names:
#       - blackbeard
#     fqdn: blackbeard.tortuga.lokal
#   - ip: 10.23.43.20
#     names:
#       - barbossa
#       - barbossa-alt
#     fqdn: barbossa.tortuga.lokal
system_settings_hosts_entries: []

# Packages to install additionally (apt), e.g. extra CLI tooling.
system_settings_install_packages: []

# Packages to remove (apt), e.g. systemd-resolved when a static resolv.conf is used.
system_settings_remove_packages: []

# Default DNS server written as the `nameserver` entry into /etc/resolv.conf.
# Set it when systemd-resolved is disabled (see system_settings_remove_packages);
# leave empty to keep resolv.conf untouched.
system_settings_dns_server: ""

system_settings_timezone: "Europe/Berlin"

system_settings_locale_name: "en_US.UTF-8"

system_settings_keyboard_model: "pc105"
system_settings_keyboard_layout: "de"
system_settings_keyboard_variant: "nodeadkeys"
system_settings_keyboard_options: "compose:menu"

system_settings_console_charset: "UTF-8"
system_settings_console_codeset: "Lat15"
system_settings_console_fontface: "Terminus"
system_settings_console_fontsize: "8x16"
