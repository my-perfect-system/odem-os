---
argument_specs:
  main:
    short_description: Configure hostname, locale, keyboard, console, and timezone
    options:
      system_settings_hostname:
        type: str
        default: "{{ inventory_hostname }}"
        description: "System hostname (set via hostname and /etc/hosts)"
      system_settings_hosts_entries:
        type: list
        default: []
        elements: dict
        description:
          - Custom /etc/hosts entries. Each entry maps an IP to one or more
            hostnames plus an optional FQDN, written as a single /etc/hosts line.
        options:
          ip:
            type: str
            required: true
            description: "IP address for the /etc/hosts line"
          names:
            type: list
            required: true
            elements: str
            description: "One or more hostnames/aliases for this IP"
          fqdn:
            type: str
            required: false
            description: "Optional fully-qualified domain name appended to the line"
      system_settings_install_packages:
        type: list
        default: []
        elements: str
        description: "Additional packages to install (apt)"
      system_settings_remove_packages:
        type: list
        default: []
        elements: str
        description: "Packages to remove (apt), e.g. systemd-resolved"
      system_settings_dns_server:
        type: str
        default: ""
        description: "Default DNS server written as a nameserver entry into /etc/resolv.conf (leave empty to skip)"
      system_settings_timezone:
        type: str
        default: "Europe/Berlin"
        description: "System timezone (timedatectl)"
      system_settings_locale_name:
        type: str
        default: "en_US.UTF-8"
        description: "System locale (LANG/LANGUAGE/LC_ALL)"
      system_settings_keyboard_model:
        type: str
        default: "pc105"
        description: "Keyboard model (XKBMODEL)"
      system_settings_keyboard_layout:
        type: str
        default: "de"
        description: "Keyboard layout (XKBLAYOUT)"
      system_settings_keyboard_variant:
        type: str
        default: "nodeadkeys"
        description: "Keyboard variant (XKBVARIANT)"
      system_settings_keyboard_options:
        type: str
        default: "compose:menu"
        description: "Keyboard options (XKBOPTIONS)"
      system_settings_console_charset:
        type: str
        default: "UTF-8"
        description: "Console character map (CHARMAP)"
      system_settings_console_codeset:
        type: str
        default: "Lat15"
        description: "Console code set (CODESET)"
      system_settings_console_fontface:
        type: str
        default: "Terminus"
        description: "Console font face (FONTFACE)"
      system_settings_console_fontsize:
        type: str
        default: "8x16"
        description: "Console font size (FONTSIZE)"
